# Runs on every push and pull request: unit tests, a production build, and a check that the Docker image builds.
name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build --configuration production

  docker:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (not pushed)
        run: docker build -t alliancetel-frontend:ci .
