# Included in every location that sets its own headers (nginx drops inherited add_header otherwise).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The browser only runs scripts and connects to servers from this site. This is the main defence against injected
# scripts stealing the sign-in token. Styles may be inline because Angular adds component styles that way.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Always use https for this site for the next year (ignored by browsers on plain http, e.g. local Docker).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
