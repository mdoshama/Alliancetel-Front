<div class="app-shell" [class.sidebar-collapsed]="collapsed()" [class.sidebar-mobile-open]="mobileOpen()">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="sidebar-brand" routerLink="/dashboard">
      <span class="brand-mark">AT</span>
      <span class="brand-text">AllianceTel</span>
    </a>

    <nav class="sidebar-nav">
      @for (section of sections; track section.title) {
        <div class="nav-section-title">{{ section.title }}</div>
        @for (item of section.items; track item.path) {
          <a class="sidebar-link" [routerLink]="item.path" routerLinkActive="active" [attr.title]="item.label">
            <i class="bi {{ item.icon }}"></i>
            <span class="link-label">{{ item.label }}</span>
          </a>
        }
      }
    </nav>

    <div class="sidebar-footer">
      <i class="bi bi-shield-check"></i>
      <span class="link-label">Workforce Scheduling</span>
    </div>
  </aside>

  <div class="sidebar-backdrop" (click)="closeMobile()"></div>

  <div class="app-main">
    <header class="topbar">
      <button type="button" class="btn btn-light btn-sm topbar-toggle" aria-label="Toggle menu" (click)="toggleSidebar()">
        <i class="bi bi-list fs-5"></i>
      </button>
      <h1 class="topbar-title">{{ heading() }}</h1>
      <div class="ms-auto d-flex align-items-center gap-2">
        <span class="badge rounded-pill text-bg-light border d-none d-sm-inline">Admin</span>
        <span class="avatar" title="Signed-in user">AD</span>
      </div>
    </header>

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>

<app-toasts />
