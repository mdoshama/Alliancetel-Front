<div class="app-shell" [class.sidebar-collapsed]="collapsed()" [class.sidebar-mobile-open]="mobileOpen()">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="sidebar-brand" [routerLink]="auth.homeUrl()">
      <span class="brand-mark">AT</span>
      <span class="brand-text">AllianceTel</span>
    </a>

    <nav class="sidebar-nav">
      @for (section of sections(); track section.title) {
        <div class="nav-section-title">{{ section.title }}</div>
        @for (item of section.items; track item.path + item.label) {
          <a class="sidebar-link" [routerLink]="item.path" routerLinkActive="active" [attr.title]="item.label">
            <i class="bi {{ item.icon }}"></i>
            <span class="link-label">{{ item.label }}</span>
          </a>
        }
      }
    </nav>

    <div class="sidebar-footer">
      <i class="bi bi-shield-check"></i>
      <span class="link-label">Workforce Scheduling</span>
    </div>
  </aside>

  <div class="sidebar-backdrop" (click)="closeMobile()"></div>

  <div class="app-main">
    <header class="topbar">
      <button type="button" class="btn btn-light btn-sm topbar-toggle" aria-label="Toggle menu" (click)="toggleSidebar()">
        <i class="bi bi-list fs-5"></i>
      </button>
      <h1 class="topbar-title">{{ heading() }}</h1>

      @if (auth.user(); as user) {
        <div class="ms-auto user-menu">
          <button type="button" class="user-menu-toggle" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()">
            <span class="d-none d-sm-flex flex-column align-items-end lh-sm">
              <span class="fw-semibold small">{{ user.fullName }}</span>
              <span class="text-muted-2" style="font-size: 0.75rem">
                {{ roleLabels[user.role] }}@if (user.areaName) { · {{ user.areaName }} }
              </span>
            </span>
            <span class="avatar">{{ initials() }}</span>
            <i class="bi bi-chevron-down small text-muted-2"></i>
          </button>
          @if (menuOpen()) {
            <div class="user-menu-backdrop" (click)="menuOpen.set(false)"></div>
            <div class="dropdown-menu dropdown-menu-end show user-menu-panel">
              <div class="px-3 py-2 small text-muted-2 border-bottom mb-1">{{ user.email }}</div>
              <a class="dropdown-item" routerLink="/change-password"><i class="bi bi-key me-2"></i>Change password</a>
              <button type="button" class="dropdown-item text-danger" (click)="signOut()">
                <i class="bi bi-box-arrow-right me-2"></i>Sign out
              </button>
            </div>
          }
        </div>
      }
    </header>

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>
